<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>remembrd</title>
<meta name="theme-color" content="#F4EEF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#150D12" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="remembrd">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4EEF1; --surface:#FFFFFF; --surface-2:#EBE0E6; --ink:#24121C; --ink-2:#56424D; --ink-3:#7D6874; --line:#E0D2DA;
  --accent:#A23B72; --accent-hover:#8A2F60; --accent-ink:#FFFFFF; --accent-soft:#F6DDEA; --pop:#D9589B;
  --good:#1E7A4C; --good-soft:#DDF1E6; --danger:#B3261E; --danger-soft:#F9E3E1;
  --shadow:0 1px 2px rgba(36,18,28,.06),0 6px 20px rgba(36,18,28,.06);
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#150D12; --surface:#1F151B; --surface-2:#2B1F26; --ink:#F1E6EC; --ink-2:#C4B0BB; --ink-3:#9A8490; --line:#352832;
    --accent:#EE8CC0; --accent-hover:#F4A6CF; --accent-ink:#2A0A1A; --accent-soft:#3A1D2D; --pop:#F4A6CF;
    --good:#5CC592; --good-soft:#15301F; --danger:#F08A80; --danger-soft:#3A1D1B; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#150D12; --surface:#1F151B; --surface-2:#2B1F26; --ink:#F1E6EC; --ink-2:#C4B0BB; --ink-3:#9A8490; --line:#352832;
  --accent:#EE8CC0; --accent-hover:#F4A6CF; --accent-ink:#2A0A1A; --accent-soft:#3A1D2D; --pop:#F4A6CF;
  --good:#5CC592; --good-soft:#15301F; --danger:#F08A80; --danger-soft:#3A1D1B; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}

/* Header */
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;min-width:0;text-align:left}
.mark{width:34px;height:34px;border-radius:10px;flex:none;position:relative;overflow:hidden;background-color:#A23B72;
  background-image:radial-gradient(circle at 24% 74%,rgba(255,255,255,.6) 0 1.6px,transparent 2px),radial-gradient(circle at 78% 80%,rgba(255,255,255,.5) 0 1.3px,transparent 1.7px),radial-gradient(circle at 80% 24%,rgba(255,255,255,.55) 0 1.1px,transparent 1.5px),linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,0) 60%)}
.mark::before{content:"";position:absolute;left:7px;right:7px;top:10px;height:3px;border-radius:3px;background:rgba(255,255,255,.9)}
.mark::after{content:"";position:absolute;left:6px;top:8.5px;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55)}
.word{font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:-.035em;line-height:1}
.word b{color:var(--pop);font-weight:800}
.spacer{flex:1}
.topnav{display:flex;gap:2px;padding-bottom:8px;overflow-x:auto;scrollbar-width:none}.topnav::-webkit-scrollbar{display:none}.topnav button{flex:none;white-space:nowrap}
.topnav button{border:0;background:none;border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;color:var(--ink-2);min-height:36px;display:inline-flex;align-items:center;gap:6px}
.topnav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.topnav .ct{font-family:var(--mono);font-size:11.5px;font-weight:500;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px;min-width:18px;text-align:center}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;font-weight:600;font-size:14px;white-space:nowrap;line-height:1.2;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.big{width:100%;min-height:52px;font-size:16px;font-weight:700;border-radius:16px}
.btn:disabled{opacity:.5;cursor:default}

/* Capture */
.capture{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:var(--shadow)}
.capture textarea{width:100%;border:0;background:none;resize:none;min-height:76px;font-size:17px;line-height:1.45;padding:4px 4px 8px;outline:none}
.capture textarea::placeholder{color:var(--ink-3)}
.caprow{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.shot{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-weight:600;font-size:14px;color:var(--ink-2);min-height:40px;cursor:pointer;background:var(--surface)}
.shot input{position:absolute;inset:0;opacity:0;font-size:0;cursor:pointer}
.shot svg{color:var(--accent)}
.pending{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.pending .th{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.pending img{width:100%;height:100%;object-fit:cover}
.pending .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.62);color:#fff;font-size:12px;line-height:1}
.keycard{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;margin-top:12px}
.keycard h2{font-size:17px}

/* Filters */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;margin-top:16px}
.search input{border:0;background:none;outline:none;width:100%;min-width:0;font-size:16px}
.search svg{flex:none;color:var(--ink-3)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--ink-2);min-height:38px}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip .n{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-weight:400}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}

/* Notes */
.day{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;margin:18px 2px 8px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.nhead{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.cat{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:2px 8px;font-size:12.5px}
.cat .dot{width:7px;height:7px;border-radius:50%}
.nhead .t{font-family:var(--mono);margin-left:auto;white-space:nowrap}
.note h3{font-size:17px;font-weight:700;margin-top:6px;line-height:1.3}
.ntext{margin-top:4px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.nimg{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.nimg button{all:unset;cursor:zoom-in;width:72px;height:72px;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.nimg img{width:100%;height:100%;object-fit:cover;display:block}
.sorting{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12.5px;font-weight:600}
.prog{margin-top:10px}
.pbar{position:relative;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent);transition:width .5s ease;overflow:hidden}
.pbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shimmer 1.4s linear infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.prow{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:13px;color:var(--ink-3);font-weight:600}
.ptime{flex:none;font-variant-numeric:tabular-nums;text-align:right}
@media (prefers-reduced-motion:reduce){.pbar i::after{animation:none}}
.who{display:inline-flex;align-items:center;margin-left:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;vertical-align:1px;min-height:22px}
.who.p{background:var(--accent);border-color:var(--accent);color:#fff}
.selrow{margin-top:12px;display:flex;align-items:center;min-height:40px}
.sel{cursor:pointer;-webkit-tap-highlight-color:transparent;outline:2px solid transparent;transition:outline-color .15s}
.sel.on{outline-color:var(--accent)}
.selc{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;background:var(--surface)}
.sel.on .selc{background:var(--accent);border-color:var(--accent)}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:60}
.selbar .primary{margin-left:auto;min-width:96px}
.pcancel{margin-top:8px;min-height:34px;font-size:13px;padding:0 12px}
.x{flex:none;width:30px;height:30px;margin-right:-4px;border:0;border-radius:50%;background:transparent;color:var(--muted,#8a7f86);font-size:15px;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
.x.sh{margin-right:-8px;display:grid;place-items:center}
.x:active{background:rgba(0,0,0,.08)}
.ev{display:flex;align-items:center;gap:10px;margin-top:10px;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.ev .cal{flex:none;width:42px;text-align:center;background:var(--surface);border-radius:9px;padding:3px 0 4px;line-height:1.1}
.ev .cal .m{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
.ev .cal .d{font-family:var(--display);font-size:19px;font-weight:800}
.ev .info{flex:1;min-width:0}
.ev .info b{display:block;font-size:14.5px;line-height:1.3}
.ev .info span{font-size:13px;color:var(--ink-2)}
.ev .add{flex:none;border:0;border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px;background:var(--accent);color:var(--accent-ink);min-height:36px}
.ev .add.done{background:var(--good-soft);color:var(--good)}
.ev .info .oncal{display:block;font-size:12.5px;color:var(--good);font-weight:600;margin-top:2px}
.wk{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--surface-2)}
.wkday .wk:first-child,.note>.wk:first-child{border-top:0;padding-top:2px}
.wk .tm{flex:none;width:62px;font-size:12.5px;font-weight:700;color:var(--ink-2);padding-top:2px}
.wk .info{flex:1;min-width:0}.wk .info b{display:block;font-size:14.5px;line-height:1.3}
.wk .info span{display:block;font-size:13px;color:var(--ink-2);margin-top:1px}
.wk .src{display:flex!important;align-items:center;gap:5px;flex-wrap:wrap}
.wk .src a{color:inherit;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
.wk.mail .src em{font-style:normal;color:var(--accent);font-weight:700}
.wk.cal .tm{color:var(--ink-2);font-weight:600}
.wkbtns{display:flex;gap:6px;align-items:center;margin-top:8px}
.wkbtns .add{border:0;border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;background:var(--accent);color:var(--accent-ink);min-height:34px}
.wkbtns .add.done{background:var(--good-soft);color:var(--good)}
.wkbtns .btn{min-height:34px;padding:4px 12px}
.wkbtns .x{border:0;background:none;color:var(--ink-2);font-size:15px;min-width:34px;min-height:34px}
.wkd{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;margin-top:10px}
.wkd:first-child{margin-top:0}
.linkday{border:0;background:none;width:100%;text-align:left;cursor:pointer;font-family:inherit;padding:0}
.calst{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.todo{display:flex;align-items:center;gap:12px;margin-top:10px;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.todo.now{background:var(--accent-soft)}
.todo.over .info span{color:var(--danger);font-weight:600}
.todo .tick{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);color:var(--accent-ink);font-weight:800;font-size:15px;display:grid;place-items:center;padding:0}
.todo.done .tick{background:var(--good);border-color:var(--good);color:#fff}
.todo.done .info b{text-decoration:line-through;color:var(--ink-3)}
.todo .info{flex:1;min-width:0}
.todo .info b{display:block;font-size:15px;line-height:1.3}
.todo .info span{font-size:13px;color:var(--ink-2)}
.todo .add{flex:none;border:0;border-radius:999px;padding:7px 11px;font-weight:700;font-size:12.5px;background:var(--surface);color:var(--accent);min-height:34px}
.todo .add.done{color:var(--good)}
.duebox{margin-top:14px;background:var(--surface);border:1.5px solid var(--accent);border-radius:var(--r);padding:12px 14px 14px;box-shadow:var(--shadow)}
.duehead{display:flex;align-items:baseline;justify-content:space-between}
.duehead h2{font-size:18px;font-weight:800}
.duehead span{font-size:13px;color:var(--ink-3);font-weight:600}
.duerow{display:flex;align-items:center;gap:8px}
.duerow>.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:10px}
.duerow .todo{flex:1}
.toast .undo{margin-left:10px;border:0;background:none;color:var(--pop);font-weight:800;padding:0}
.nfoot{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
.nfoot .btn{min-height:34px;padding:6px 12px;font-size:13px}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;margin-top:16px;color:var(--ink-2)}
.empty h2{font-size:20px;color:var(--ink);margin-bottom:4px}
.err{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:9px 12px;font-size:13.5px;margin-top:8px}

/* Edit sheet */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(20,8,14,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet h2{font-size:21px;font-weight:800}
.sheet a{color:var(--accent);font-weight:700}
.sheet ol{margin:10px 0 0;padding-left:20px;color:var(--ink-2);font-size:15px;display:flex;flex-direction:column;gap:6px}
.lbl{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;margin:14px 0 6px}
.inp,.sheet textarea,.sheet select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px}
.sheet textarea{min-height:110px;resize:vertical}
.hint{font-size:13px;color:var(--ink-3);margin:8px 0 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheetfoot{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.sheetfoot .btn{flex:1}

.lb{position:fixed;inset:0;z-index:90;background:rgba(10,4,8,.92);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px))}
.lb img{max-width:100%;max-height:88vh;border-radius:12px;object-fit:contain}
.lb button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--surface-2);border-top-color:var(--accent);animation:spin .9s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
.pad{height:48px}
.kidb{display:inline-flex;align-items:center;font-size:11.5px;font-weight:800;border-radius:6px;padding:1px 7px;color:var(--kc);background:color-mix(in srgb,var(--kc) 15%,transparent);white-space:nowrap;line-height:1.6}
.wk .info .kidb{display:inline-flex;margin-top:0;font-size:11.5px;color:var(--kc)}
.kidchips{margin-top:12px}
.prep{margin-top:14px;background:var(--surface);border:1.5px solid var(--accent);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow)}
.prephead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.prephead h2{font-size:18px;font-weight:800}
.prephead span{font-size:13px;color:var(--ink-3);font-weight:600}
.pgrp{margin-top:12px}
.pgrp>.kidb{margin-bottom:4px}
.pgrp .gl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700;margin-bottom:4px}
.pitem{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.pitem .info{flex:1;min-width:0}
.pitem .info b{display:block;font-size:15px;font-weight:600;line-height:1.35}
.pitem.done .info b{text-decoration:line-through;color:var(--ink-3)}
.pitem .info .stag{margin-top:3px}
.prepfoot{display:flex;gap:8px;margin-top:10px;align-items:center}
.prepfoot .btn{flex:1}
.wk .info .todoline{color:var(--accent);font-weight:600;font-size:13px}
.pk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);color:var(--accent-ink);font-weight:800;font-size:14px;display:grid;place-items:center;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}

<script>
/* ---------- constants ---------- */
const DEFAULT_CATS=["Baseball","Church","Home","Work","School"];
const CAT_COLORS={Rodeo:"#B0652A",Baseball:"#D6453D",Church:"#7B5CC4",Home:"#1F9494",Work:"#2F6FD1",School:"#D99A1B"};
const EXTRA_COLORS=["#E0702C","#5A9A3A","#C2478E","#3E8FB0","#8C6A3F","#6A7A92","#B0452F","#2E9B5F"];
const TZ=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||"America/Chicago"}catch(e){return "America/Chicago"}})();

/* ---------- state ---------- */
const S={kid:"all",pickOff:new Set(),pickOn:new Set(),mailOff:new Set(),notes:[],ready:false,view:"notes",filter:"All",q:"",draft:"",shots:[],busy:{},edit:null,confirmDel:false,db:null,sel:null,who:"all"};
function partnerName(){try{return (localStorage.getItem("partner_name")||"").trim()||"Partner"}catch(e){return "Partner"}}
const whoName=t=>t&&t.who==="partner"?partnerName():"Me";

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)).replace(/-/g,"");
function toast(msg,undo,act){const t=$("#toast");t.innerHTML=esc(msg)+(undo?' <button class="undo" data-act="undo">Undo</button>':"")+(act?` <button class="undo" data-act="${act.act}" data-id="${esc(act.id||"")}" data-v="${esc(act.v||"")}">${esc(act.label)}</button>`:"");t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,undo||act?6000:2600)}
const icon={
  shot:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>',
  cam:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  search:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'
};
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- categories ---------- */
function getCats(){const c=lsGet("remembrd_cats",null);return Array.isArray(c)&&c.length?c:[...DEFAULT_CATS]}
function setCats(c){lsSet("remembrd_cats",c)}
function addCat(name){name=String(name||"").trim().replace(/\s+/g," ").slice(0,24);if(!name)return "Home";
  const c=getCats(),hit=c.find(x=>x.toLowerCase()===name.toLowerCase());if(hit)return hit;
  name=name.replace(/\b\w/g,m=>m.toUpperCase());c.push(name);setCats(c);return name}
function catColor(name){if(CAT_COLORS[name])return CAT_COLORS[name];const c=getCats().filter(x=>!CAT_COLORS[x]),i=c.indexOf(name);return EXTRA_COLORS[(i<0?0:i)%EXTRA_COLORS.length]}

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
function nowContext(){
  const d=new Date();
  return `${d.toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}, ${d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})} (${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}), time zone ${TZ}`;
}
function evStart(ev){const [y,m,d]=String(ev.date).split("-").map(Number);if(!y)return null;const [h,mi]=ev.start?String(ev.start).split(":").map(Number):[0,0];return new Date(y,m-1,d,h||0,mi||0)}
function fmtEvWhen(ev){
  const s=evStart(ev);if(!s)return "";
  const day=s.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  if(!ev.start)return day+" · All day";
  const t=x=>{const [h,m]=String(x).split(":").map(Number);const dd=new Date(2000,0,1,h,m);return dd.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})};
  return day+" · "+t(ev.start)+(ev.end?"–"+t(ev.end):"");
}
function gcalUrl(ev){
  const s=evStart(ev);if(!s)return null;
  let dates;
  if(!ev.start){const e=new Date(s);e.setDate(e.getDate()+(ev.endDate?Math.max(1,Math.round((evStart({date:ev.endDate})-s)/864e5)+1):1));
    dates=`${s.getFullYear()}${pad(s.getMonth()+1)}${pad(s.getDate())}/${e.getFullYear()}${pad(e.getMonth()+1)}${pad(e.getDate())}`}
  else{let e;if(ev.end){const [h,m]=ev.end.split(":").map(Number);e=new Date(s);e.setHours(h,m);if(e<=s)e.setDate(e.getDate()+1)}else e=new Date(s.getTime()+36e5);
    const f=x=>`${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;dates=f(s)+"/"+f(e)}
  const q=new URLSearchParams({action:"TEMPLATE",text:ev.title||"Event",dates,ctz:TZ});
  if(ev.location)q.set("location",ev.location);if(ev.details)q.set("details",ev.details);
  return "https://calendar.google.com/calendar/render?"+q.toString();
}
/* ---------- to-dos ---------- */
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr=()=>ymd(new Date());
const parseYmd=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d)};
const REPEATS={daily:"Every day",weekly:"Every week",monthly:"Every month",yearly:"Every year"};
const ordinal=n=>n+(n%100>=11&&n%100<=13?"th":({1:"st",2:"nd",3:"rd"})[n%10]||"th");
function stepDate(anchor,freq,k){
  const a=parseYmd(anchor),y=a.getFullYear(),m=a.getMonth(),d=a.getDate();
  if(freq==="daily")return new Date(y,m,d+k);
  if(freq==="weekly")return new Date(y,m,d+7*k);
  if(freq==="monthly"){const last=new Date(y,m+k+1,0).getDate();return new Date(y,m+k,Math.min(d,last))}
  const last=new Date(y+k,m+1,0).getDate();return new Date(y+k,m,Math.min(d,last));
}
function nextAfter(t,after){for(let k=0;k<5000;k++){const d=ymd(stepDate(t.anchor,t.repeat,k));if(d>after)return d}return after}
function repeatLabel(t){
  if(!t.repeat)return "";const a=parseYmd(t.anchor);
  if(t.repeat==="daily")return "Every day";
  if(t.repeat==="weekly")return "Every "+a.toLocaleDateString(undefined,{weekday:"long"});
  if(t.repeat==="monthly")return "Every month on the "+ordinal(a.getDate());
  return "Every year on "+a.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function taskState(t){if(!t||t.doneAt)return "done";return t.due<=todayStr()?"now":"later"}
function dueLabel(t){
  if(t.doneAt)return "Done "+new Date(t.doneAt).toLocaleDateString(undefined,{month:"short",day:"numeric"});
  const diff=Math.round((parseYmd(t.due)-parseYmd(todayStr()))/864e5);
  if(diff===0)return "Due today";if(diff===-1)return "Due yesterday";if(diff<0)return `${-diff} days overdue`;
  if(diff===1)return "Due tomorrow";
  return "Due "+parseYmd(t.due).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
}
function taskGcalUrl(n){
  const t=n.task,s=parseYmd(t.due),e=new Date(s);e.setDate(e.getDate()+1);
  const f=x=>`${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}`;
  const q=new URLSearchParams({action:"TEMPLATE",text:t.title||n.title||"To-do",dates:f(s)+"/"+f(e),ctz:TZ});
  if(t.repeat)q.set("recur","RRULE:FREQ="+t.repeat.toUpperCase());
  if(n.text)q.set("details",n.text.slice(0,500));
  return "https://calendar.google.com/calendar/render?"+q.toString();
}
function makeTask(raw,fallbackTitle){
  if(!raw||typeof raw!=="object")return null;
  const due=/^\d{4}-\d{2}-\d{2}$/.test(String(raw.due||""))?String(raw.due):todayStr();
  const repeat=REPEATS[String(raw.repeat||"").toLowerCase()]?String(raw.repeat).toLowerCase():null;
  return {title:String(raw.title||fallbackTitle||"To-do").slice(0,100),due,anchor:due,repeat,log:[],doneAt:null,added:false};
}
function dueTasks(){return S.notes.filter(n=>n.task&&taskState(n.task)==="now").sort((a,b)=>a.task.due<b.task.due?-1:1)}
let lastUndo=null;
async function completeTask(id){
  const n=S.notes.find(x=>x.id===id);if(!n||!n.task)return;
  const t=n.task;lastUndo={id,task:JSON.parse(JSON.stringify(t))};
  t.log=(t.log||[]).concat({due:t.due,doneAt:new Date().toISOString()}).slice(-60);
  let msg;
  if(t.repeat){const today=todayStr();t.due=nextAfter(t,t.due>today?t.due:today);
    msg="Done. Next: "+parseYmd(t.due).toLocaleDateString(undefined,{month:"short",day:"numeric"})}
  else{t.doneAt=new Date().toISOString();msg="Done"}
  await putNote(n);render();toast(msg,true);
}
function selTools(isTodo){
  const whoRow=isTodo&&!S.sel?`<div class="chips" style="margin-top:12px">${[["all","Everyone"],["me","Me"],["partner",partnerName()]].map(([v,l])=>`<button class="chip" data-act="whof" data-v="${v}" ${S.who===v?'aria-pressed="true"':""}>${esc(l)}</button>`).join("")}</div>`:"";
  return `<div class="selrow">${S.sel?`<span class="hint" style="margin:0">Tap to-dos and dates to include. You can switch tabs.</span>`:`<button class="btn" data-act="selstart">Select to send</button>`}</div>`+whoRow;
}
function selBarHTML(){
  if(!S.sel)return "";const k=S.sel.size;
  return `<div style="height:90px"></div><div class="selbar"><button class="btn ghost" data-act="selcancel">Cancel</button>${S.view==="todo"?`<button class="btn ghost" data-act="selpartner">All ${esc(partnerName())}'s</button>`:""}<button class="btn primary" data-act="selsend" ${k?"":"disabled"}>Send${k?" "+k:""}</button></div>`;
}
function selText(){
  const tasks=[],evs=[];
  for(const key of S.sel){const [kind,nid,eid]=key.split(":");const n=S.notes.find(x=>x.id===nid);if(!n)continue;
    if(kind==="t"&&n.task)tasks.push(n.task);
    else if(kind==="e"){const ev=(n.events||[]).find(x=>x.id===eid);if(ev)evs.push(ev)}}
  tasks.sort((a,b)=>a.due<b.due?-1:1);evs.sort((a,b)=>(evStart(a)||0)-(evStart(b)||0));
  const mixed=tasks.some(t=>t.who==="partner")&&tasks.some(t=>t.who!=="partner");
  const tl=t=>{const when=parseYmd(t.due).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
    return `• ${t.title} (by ${when}${t.repeat?", "+repeatLabel(t).replace(/^E/,"e"):""})${mixed&&t.who!=="partner"?" [I've got this one]":""}`};
  const el=e=>`• ${e.title}: ${fmtEvWhen(e)}${e.location?", "+e.location:""}`;
  const parts=[];
  if(tasks.length)parts.push((tasks.length===1?"Reminder:\n":"To do:\n")+tasks.map(tl).join("\n"));
  if(evs.length)parts.push("Coming up:\n"+evs.map(el).join("\n"));
  return parts.join("\n\n");
}
async function selSend(){
  const text=selText();if(!text)return;
  if(navigator.share){try{await navigator.share({text});S.sel=null;render()}catch(e){}return}
  try{await navigator.clipboard.writeText(text);toast("Copied. Paste it into a text.")}catch(e){location.href="sms:&body="+encodeURIComponent(text)}
  S.sel=null;render();
}
// send a to-do to someone (Messages, etc.) via the iPhone share sheet
async function shareTask(id){
  const n=S.notes.find(x=>x.id===id);if(!n||!n.task)return;const t=n.task;
  const when=parseYmd(t.due).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  const text=`Reminder: ${t.title}\nDue ${when}${t.repeat?" ("+repeatLabel(t).replace(/^E/,"e")+")":""}`;
  if(navigator.share){try{await navigator.share({text})}catch(e){}return}
  try{await navigator.clipboard.writeText(text);toast("Copied. Paste it into a text.")}catch(e){location.href="sms:&body="+encodeURIComponent(text)}
}
// remove a to-do (evId null) or one date from a note; remembered so re-sorting won't bring it back
async function dismissItem(id,evId){
  const n=S.notes.find(x=>x.id===id);if(!n)return;
  lastUndo={id,task:n.task?JSON.parse(JSON.stringify(n.task)):null,events:JSON.parse(JSON.stringify(n.events||[])),dismissed:(n.dismissed||[]).slice()};
  let title;
  if(evId==null){if(!n.task)return;title=n.task.title;n.task=null}
  else{const ev=(n.events||[]).find(x=>x.id===evId);if(!ev)return;title=ev.title;n.events=n.events.filter(x=>x.id!==evId)}
  n.dismissed=(n.dismissed||[]).concat(title.toLowerCase()).slice(-30);
  const par=n.parent&&S.notes.find(x=>x.id===n.parent);if(par){par.dismissed=(par.dismissed||[]).concat(title.toLowerCase()).slice(-30);putNote(par)}
  await putNote(n);render();toast(evId==null?"To-do removed":"Date removed",true);
}
// stop a sort in progress and delete that note (Undo brings it back and re-sorts)
let pendingBlobDel=null;
function cancelNote(id){
  const n=S.notes.find(x=>x.id===id);if(!n)return;
  if(ABORT[id])ABORT[id].abort();
  const idx=S.notes.indexOf(n);S.notes.splice(idx,1);delNote(id);
  lastUndo={restore:n,idx};
  clearTimeout(pendingBlobDel);const imgs=n.images||[];
  pendingBlobDel=setTimeout(()=>{if(!S.notes.includes(n))imgs.forEach(delBlob)},8000);
  render();toast("Stopped and deleted",true);
}
async function undoTask(){
  if(lastUndo&&lastUndo.restore){const {restore:n,idx}=lastUndo;lastUndo=null;clearTimeout(pendingBlobDel);
    S.notes.splice(Math.min(idx,S.notes.length),0,n);n.status="unsorted";n.err=null;await putNote(n);$("#toast").hidden=true;render();sortNote(n.id);return}
  if(!lastUndo)return;const n=S.notes.find(x=>x.id===lastUndo.id);if(!n)return;
  n.task=lastUndo.task;if(lastUndo.events)n.events=lastUndo.events;if(lastUndo.dismissed)n.dismissed=lastUndo.dismissed;lastUndo=null;await putNote(n);$("#toast").hidden=true;render();
}
function dayLabel(iso){const d=new Date(iso),t=new Date();const k=x=>x.toDateString();const y=new Date(t);y.setDate(t.getDate()-1);
  if(k(d)===k(t))return "Today";if(k(d)===k(y))return "Yesterday";

    im.onload=()=>{try{let w=im.naturalWidth,h=im.naturalHeight;if(!w||!h||Math.max(w,h)<=max)return keep();const sc=max/Math.max(w,h);w=Math.round(w*sc);h=Math.round(h*sc);

  if(images&&images.length)stage(images.length>1?`Shrinking ${images.length} screenshots`:"Shrinking screenshot");
  const key=getKey();if(!key)throw {code:"bad_key"};

  const think=m=>/^gemini-2\.5-flash$/.test(m)?{thinkingBudget:0}:/^gemini-2\./.test(m)?null:{thinkingLevel:"low"};
  const noThink=new Set();
  const bodyFor=m=>{const g={responseMimeType:"application/json",temperature:0.2},t=noThink.has(m)?null:think(m);if(t)g.thinkingConfig=t;return JSON.stringify({contents:[{role:"user",parts}],generationConfig:g})};

      try{localStorage.setItem("gemini_model",m)}catch(e){}

function buildPrompt(note,hasImages){
  return `You are the sorting engine for remembrd, a personal quick-notes app. Read the note${hasImages?" and the attached screenshot(s)":""} and return structured info.

RIGHT NOW: ${nowContext()}.

CATEGORIES (use one of these when it fits): ${JSON.stringify(getCats())}
If none of them fits well, create ONE new short category (1-2 words, Title Case, general enough to reuse, like "Doctor", "Kids", "Finance", "Travel"). Prefer existing categories. Baseball covers games, practices, tournaments, team snacks and fees. Church covers services, small groups, volunteering and church events. "AEC", "Agriculture Education Committee" or "Ag Ed" is her rodeo committee (a volunteer group, not her job): always use "Rodeo" for it, never "Work".

NOTE TEXT: ${note.text?JSON.stringify(note.text):"(none, screenshot only)"}

RULES:
- "title": 3-8 word summary a person would scan for.
- "summary": ${hasImages?"the useful information from the screenshot in 1-4 short plain lines (who, what, when, where, anything to bring or pay). No commentary.":"empty string (the typed note is kept as is)."}
- "events": every specific event, appointment or deadline with a date you can pin down. Resolve relative dates ("next Tuesday", "tomorrow", "the 14th") against RIGHT NOW. If the year is missing, use the next upcoming occurrence. Times in 24h "HH:MM", local time. Use null for start when there's no time (all-day). Include "endDate" only for multi-day events. Don't create events for vague things ("sometime soon") or dates in the past. A schedule screenshot can produce several events (max 25).
- Event "title" should make sense on a calendar by itself, like "Baseball game vs Tigers" or "Church potluck".
- "location" only if stated. "details": short useful extras (what to bring, cost, links), or empty string.
- Event "todo": decide whether the event comes with something she has to DO for it: bring, donate, chip in, pay, buy, sign, send, wear, pack, RSVP, sign up, volunteer, bake. If so, return {"title": short imperative that names who or what it's for, like "Donate for Ms. Sweeney's birthday gift" or "Bring a pumpkin to school", "due": the stated deadline as "YYYY-MM-DD", otherwise the event date}. If there's nothing to do beyond showing up, "todo": null.
- "task": if the note is something she has to DO (a chore, errand, reminder, bill, medication, form, call to make) rather than an event to attend, return a to-do: {"title": short imperative like "Give dogs heartworm meds", "due": "YYYY-MM-DD", "repeat": null or "daily" | "weekly" | "monthly" | "yearly"}. For repeating to-dos ("on the 15th of every month", "every Tuesday", "each year on May 1"), set repeat and make "due" the next occurrence on or after today (today counts). For a one-time to-do with a date, use that date; with no date, use today. Use "task" only for a to-do that stands on its own with no event behind it; a to-do tied to an event goes in that event's "todo". Don't repeat the same to-do in both places. Otherwise "task": null.
- Task "who": "partner" if the note says it's for her husband/partner${partnerName()!=="Partner"?" ("+partnerName()+")":""} to do (e.g. "remind ${partnerName()!=="Partner"?partnerName():"him"} to…", "${partnerName()!=="Partner"?partnerName():"he"} needs to…"), otherwise "me".

Reply with ONLY JSON:
{"category":"Baseball","newCategory":false,"title":"Saturday game vs Tigers","summary":"","events":[{"title":"Baseball game vs Tigers","date":"2026-10-04","start":"10:00","end":"12:00","endDate":null,"location":"Field 3, Memorial Park","details":"Snack duty","todo":{"title":"Bring team snacks to the game","due":"2026-10-04"}}],"task":null}
Example to-do reply: {"category":"Home","newCategory":false,"title":"Dogs' heartworm meds","summary":"","events":[],"task":{"title":"Give dogs heartworm meds","due":"2026-10-15","repeat":"monthly"}}`;
}

/* ---------- extra to-dos from one note (each lives in a small linked note) ---------- */
const kidsOf=n=>S.notes.filter(c=>c.parent===n.id);
async function syncKids(n,raws){
  const old=kidsOf(n),keep=new Set();
  for(const raw of raws){
    const t=makeTask(raw,raw.title);if(!t)continue;t.who="me";
    let c=old.find(o=>o.task&&o.task.title.toLowerCase()===t.title.toLowerCase());
    if(c){c.task.due=t.due;c.task.anchor=t.anchor;c.category=n.category;keep.add(c.id);await putNote(c);continue}
    c={id:uid(),parent:n.id,createdAt:n.createdAt,text:"",title:t.title,summary:"",category:n.category,images:[],events:[],status:"sorted",source:n.source||noteSrc(n),msgId:n.msgId||"",task:t};
    S.notes.push(c);keep.add(c.id);await putNote(c);
  }
  for(const c of old)if(!keep.has(c.id)){S.notes=S.notes.filter(x=>x!==c);delNote(c.id)}

/* ---------- sorting progress ---------- */
const PROG={};let progT=null;
function startProg(id,exp){PROG[id]={stage:"Getting ready",start:Date.now(),exp};if(!progT)progT=setInterval(tickProg,500)}
function setProg(id,t){if(PROG[id]){PROG[id].stage=t;tickProg()}}
function stopProg(id){delete PROG[id];if(!Object.keys(PROG).length){clearInterval(progT);progT=null}}
function progVals(id){const p=PROG[id];if(!p)return null;const sec=Math.floor((Date.now()-p.start)/1000);
  // bar eases toward 95% based on typical time; never claims done until it is
  const pct=Math.round(95*(1-Math.exp(-sec/p.exp)));
  const hint=sec>=p.exp*2.5?" · taking longer than usual, still working":"";
  return {stage:p.stage+"…",time:(sec>=60?Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0"):sec+"s")+hint,pct}}
function progHTML(id){const v=progVals(id)||{stage:"Getting ready…",time:"0s",pct:0};
  return `<div class="prog" data-prog="${id}"><div class="pbar"><i style="width:${v.pct}%"></i></div><div class="prow"><span class="pstage">${esc(v.stage)}</span><span class="ptime">${esc(v.time)}</span></div><button class="btn pcancel" data-act="cancelsort" data-id="${id}">Cancel &amp; delete</button></div>`}
function tickProg(){document.querySelectorAll("[data-prog]").forEach(el=>{const v=progVals(el.dataset.prog);if(!v)return;
  el.querySelector(".pbar i").style.width=v.pct+"%";const st=el.querySelector(".pstage");if(st.textContent!==v.stage)st.textContent=v.stage;el.querySelector(".ptime").textContent=v.time})}

  if(!text&&!shots.length){toast("Type a note or add a screenshot");return}
  const n={id:uid(),createdAt:new Date().toISOString(),text,title:"",summary:"",category:"",images:[],events:[],status:"sorting",source:shots.some(x=>x.cam)?"photo":shots.length?"shot":"note"};
  for(const s of shots){try{const id=uid();await putBlob(id,s.blob);urlCache[id]=s.url;n.images.push(id)}catch(e){console.warn(e)}}

}

    n.category=addCat(r.category||"Home");
    n.title=String(r.title||"").slice(0,90);

    n.events=(Array.isArray(r.events)?r.events:[]).filter(e=>e&&/^\d{4}-\d{2}-\d{2}$/.test(String(e.date))).slice(0,25).map(e=>({
      id:uid(),title:String(e.title||n.title||"Event").slice(0,120),date:String(e.date),
      start:/^\d{1,2}:\d{2}$/.test(String(e.start||""))?String(e.start).padStart(5,"0"):null,
      end:/^\d{1,2}:\d{2}$/.test(String(e.end||""))?String(e.end).padStart(5,"0"):null,
      endDate:/^\d{4}-\d{2}-\d{2}$/.test(String(e.endDate||""))?String(e.endDate):null,
      location:String(e.location||"").slice(0,200),details:String(e.details||"").slice(0,500),added:false}));

    if(nTodo&&n.events.length)toast(`Found ${n.events.length===1?"a date":n.events.length+" dates"} and ${nTodo===1?"a to-do":nTodo+" to-dos"}`);
    else if(nt&&nTodo>1)toast(`${nTodo} to-dos saved`);
    else if(nt)toast(nt.repeat?`To-do saved. ${repeatLabel(nt)}.`:"To-do saved. It'll stay at the top until you check it off.");

  }catch(e){if(e&&e.code==="cancelled"||!S.notes.includes(n)){delete ABORT[id];stopProg(id);return}console.error(e);n.status="unsorted";n.err=errCopy(e);n.retry=!!(e&&RETRYABLE.has(e.code));if(n.retry)scheduleRetry();if(e&&e.code==="bad_key")openSettings()}

  if(!S.notes.includes(n))return; // deleted while sorting
  await putNote(n);render();
  if(n.status==="sorted"&&((n.events||[]).length||n.task))gcCheck(false);
}

const STOPW=new Set("the and for with from your our you are vs at in on of to a an is be by day".split(" "));
const words=s=>String(s||"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(w=>w.length>2&&!STOPW.has(w)).map(w=>w.length>4?w.replace(/s$/,""):w);
function titleMatch(a,b){const A=new Set(words(a)),B=new Set(words(b));if(!A.size||!B.size)return false;let n=0;A.forEach(w=>{if(B.has(w))n++});return n/Math.min(A.size,B.size)>=0.5}
// item: {title,date:"YYYY-MM-DD",start:"HH:MM"|null}; c: Google event
function calMatch(item,c){
  if(c.status==="cancelled"||!c.start)return false;
  const allDay=!c.start.dateTime;
  const cs=allDay?parseYmd(c.start.date):new Date(c.start.dateTime);
  const ce=allDay?new Date(parseYmd(c.end&&c.end.date||c.start.date).getTime()-864e5):new Date(c.end&&c.end.dateTime||c.start.dateTime);
  const d=item.date;if(d<ymd(cs)||d>ymd(ce))return false;
  if(item.start&&!allDay){const s=evStart(item);if(Math.abs(s-cs)>90*6e4)return false}
  return titleMatch(item.title,c.summary);
}
function calItems(force){
  const today=todayStr(),stale=6*36e5,out=[];
  for(const n of S.notes){
    for(const ev of (n.events||[]))if(ev.date>=today&&!ev.added&&(force||!ev.cal||Date.now()-ev.cal.at>stale))out.push({n,obj:ev,item:ev});
    const t=n.task;if(t&&!t.doneAt&&!t.added&&(force||!t.cal||Date.now()-t.cal.at>stale))out.push({n,obj:t,item:{title:t.title,date:t.due,start:null}});
  }
  return out.filter(x=>x.item.date<=ymd(new Date(Date.now()+180*864e5)));
}
async function gcCheck(force){
  if(!gcOn()||GC.busy)return;
  const todo=calItems(force);if(!todo.length)return;
  if(!gcTok())return;
  GC.busy=true;if(S.view==="upcoming")render();
  try{
    await gcCals();
    const dates=todo.map(x=>x.item.date).sort(),min=parseYmd(dates[0]),max=parseYmd(dates[dates.length-1]);
    min.setDate(min.getDate()-1);max.setDate(max.getDate()+2);
    const lists=await Promise.all(GC.cals.map(c=>gcGet("calendars/"+encodeURIComponent(c.id)+"/events",{timeMin:min.toISOString(),timeMax:max.toISOString(),singleEvents:"true",maxResults:"2500",fields:"items(summary,start,end,status)"}).then(r=>r.items||[]).catch(e=>{if(e.code==="noauth")throw e;return []})));
    const all=lists.flat(),touched=new Set();
    for(const x of todo){const hit=all.find(c=>calMatch(x.item,c));x.obj.cal={at:Date.now(),match:hit?String(hit.summary||"").slice(0,120):null};touched.add(x.n)}
    for(const n of touched)await putNote(n);

  finally{GC.busy=false;render()}
}

const CB={busy:false};
const lt=d=>`${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
function evBody(ev,desc){
  const b={summary:ev.title||"Event"};
  if(ev.location)b.location=ev.location;
  const d=[ev.details,desc].filter(Boolean).join("\n\n");if(d)b.description=d;
  const s=evStart(ev);
  if(!ev.start){b.start={date:ev.date};b.end={date:ymd(addDays(1,ev.endDate&&ev.endDate>ev.date?ev.endDate:ev.date))}}
  else{let e;if(ev.end){const [h,m]=ev.end.split(":").map(Number);e=new Date(s);e.setHours(h,m);if(e<=s)e.setDate(e.getDate()+1)}else e=new Date(s.getTime()+36e5);
    b.start={dateTime:lt(s),timeZone:TZ};b.end={dateTime:lt(e),timeZone:TZ}}
  return b;
}
function itemBody(x){
  if(x.kind==="task"){const t=x.n.task,b={summary:t.title||x.n.title||"To-do",start:{date:t.due},end:{date:ymd(addDays(1,t.due))}};
    if(t.repeat)b.recurrence=["RRULE:FREQ="+t.repeat.toUpperCase()];if(x.n.text)b.description=x.n.text.slice(0,800);return b}
  if(x.kind==="mail")return evBody(x.m,[x.m.todo?"To do: "+x.m.todo.title:"",x.m.subject?"From email: "+x.m.subject:""].filter(Boolean).join("\n"));
  const td=[x.n,...kidsOf(x.n)].find(c=>c.task&&!c.task.doneAt&&c.task.due<=x.ev.date&&(c.task.due===x.ev.date||titleMatch(c.task.title,x.ev.title)));

async function gcInsert(body){

async function addItems(list){

function kidNames(){const v=lsGet("kids",null);return Array.isArray(v)?v.filter(Boolean):["Emmett","Arthur"]}
const KID_COLORS=["#2F7FC1","#2E9B5F","#C2478E","#E0702C","#7B5CC4"];
function kidColor(k){const i=kidNames().indexOf(k);return KID_COLORS[(i<0?0:i)%KID_COLORS.length]}
function kidsIn(text){const t=String(text||"");return kidNames().filter(k=>new RegExp("\\b"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i").test(t))}
function rowKids(r){
  const x=r.x;let first="",second="";
  if(r.src==="cal")first=x.title+" "+(x.desc||"");
  else if(r.src==="mail"){first=[x.title,x.details,x.todo&&x.todo.title].join(" ");second=x.subject}
  else if(r.src==="task"){const n=x.n,par=n.parent&&S.notes.find(p=>p.id===n.parent);first=n.task.title;second=[n.title,n.text,n.summary,par&&par.title,par&&par.text].join(" ")}
  else{first=[x.title,x.ev&&x.ev.details].join(" ");second=[x.n.title,x.n.text,x.n.summary].join(" ")}
  const k=kidsIn(first);return k.length?k:kidsIn(second);
}
function kidBadges(list){return (list||[]).map(k=>`<span class="kidb" style="--kc:${kidColor(k)}">${esc(k)}</span>`).join("")}
function kidFilter(rows){return S.kid==="all"?rows:rows.filter(r=>rowKids(r).includes(S.kid))}
function kidChips(){
  const ks=kidNames();if(!ks.length)return "";
  return `<div class="chips kidchips"><button class="chip" data-act="kidf" data-v="all" aria-pressed="${S.kid==="all"}">Everyone</button>${ks.map(k=>`<button class="chip" data-act="kidf" data-v="${esc(k)}" aria-pressed="${S.kid===k}"><span class="dot" style="background:${kidColor(k)}"></span>${esc(k)}</button>`).join("")}</div>`;
}

/* ---------- night before: tomorrow morning checklist ---------- */
const isEvening=()=>new Date().getHours()>=17;
function prepDone(){const tm=ymd(addDays(1)),v=lsGet("prep_done",null);return v&&v.date===tm?v:{date:tm,keys:[]}}
function prepItems(){
  const tm=ymd(addDays(1)),out=[];
  const tasks=S.notes.filter(n=>n.task&&n.task.due===tm);
  const b=T.brief&&T.brief.items||[];
  for(const it of b.filter(i=>i.day==="tomorrow")){
    const text=it.text.replace(/^tomorrow[:,]?\s*/i,"").replace(/^./,c=>c.toUpperCase());
    const tk=tasks.find(n=>titleMatch(n.task.title,text));
    out.push({key:"b:"+text.toLowerCase().slice(0,60),text,kid:it.kid||kidsIn(text)[0]||null,srcs:it.srcs||[],task:tk?tk.id:null});
  }
  for(const n of tasks){
    if(out.some(o=>o.task===n.id))continue;
    const par=n.parent&&S.notes.find(p=>p.id===n.parent);
    out.push({key:"t:"+n.id,task:n.id,text:n.task.title,kid:kidsIn(n.task.title)[0]||kidsIn([n.title,n.text,par&&par.title,par&&par.text].join(" "))[0]||null,srcs:[{k:noteSrc(n),extra:"to-do",href:""}]});
  }
  const d=prepDone();
  out.forEach(o=>{const n=o.task&&S.notes.find(x=>x.id===o.task);o.done=n?!!n.task.doneAt:d.keys.includes(o.key)});
  return out;
}
function prepHTML(){
  const tm=addDays(1),all=prepItems(),items=S.kid==="all"?all:all.filter(o=>o.kid===S.kid);
  let h=`<section class="prep"><div class="prephead"><h2>Tomorrow morning</h2><span>${esc(tm.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}))}</span></div>`;
  if(T.busy&&!all.length)return h+`<p class="hint"><span class="spinner"></span> Checking what needs to go out the door…</p></section>`;
  if(!items.length)return h+`<p class="hint" style="margin-top:4px">${S.kid==="all"?"Nothing to pack, wear or sign for tomorrow.":"Nothing for "+esc(S.kid)+" tomorrow."}${getKey()?"":" Add your Gemini key in Settings to pull these from email and events."}</p></section>`;
  const groups=[...kidNames().map(k=>[k,items.filter(o=>o.kid===k)]),[null,items.filter(o=>!o.kid||!kidNames().includes(o.kid))]].filter(g=>g[1].length);
  h+=groups.map(([k,list])=>`<div class="pgrp">${k?kidBadges([k]):groups.length>1?`<div class="gl">Everyone</div>`:""}${list.map(o=>`<div class="pitem ${o.done?"done":""}"><button class="pk ${o.done?"on":""}" data-act="prepchk" data-v="${esc(o.key)}" role="checkbox" aria-checked="${o.done}" aria-label="${esc(o.text)}">${o.done?"✓":""}</button><div class="info"><b>${esc(o.text)}</b>${(o.srcs||[]).slice(0,1).map(s=>srcTag(s.k,s.extra,s.href)).join("")}</div></div>`).join("")}</div>`).join("");
  const left=items.filter(o=>!o.done).length;
  return h+`<div class="prepfoot"><button class="btn" data-act="prepsend" ${left?"":"disabled"}>Send to ${esc(partnerName())}</button></div></section>`;
}
async function prepCheck(key){
  const o=prepItems().find(i=>i.key===key);if(!o)return;
  if(o.task){const n=S.notes.find(x=>x.id===o.task);if(!n||!n.task)return;
    if(n.task.doneAt){n.task.doneAt=null;await putNote(n);render()}else await completeTask(n.id);return}
  const d=prepDone();d.keys=d.keys.includes(key)?d.keys.filter(k=>k!==key):d.keys.concat(key);lsSet("prep_done",d);render();
}
async function prepSend(){
  const items=prepItems().filter(o=>!o.done&&(S.kid==="all"||o.kid===S.kid));if(!items.length)return;
  const when=addDays(1).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
  const text=`For tomorrow morning (${when}):\n`+items.map(o=>"• "+(o.kid&&!kidsIn(o.text).includes(o.kid)?o.kid+": ":"")+o.text).join("\n");
  if(navigator.share){try{await navigator.share({text})}catch(e){}return}
  try{await navigator.clipboard.writeText(text);toast("Copied. Paste it into a text.")}catch(e){location.href="sms:&body="+encodeURIComponent(text)}
}

const T={brief:lsGet("brief",null),busy:false,key:""};
function syncLine(){
  const busy=W.calBusy||W.mailBusy,at=Math.max(W.cal.at||0,W.mail.at||0);
  return busy?`<span class="spinner"></span> ${esc(W.stage||"Loading your calendar")}…`

function briefRows(){
  const M=weekModel(),out=[];
  [0,1].forEach(k=>M.days[k].rows.forEach(r=>out.push({day:k?"TOMORROW":"TODAY",r})));

}
function briefLine({day,r},i){
  const x=r.x,at=x.start?" at "+x.start:"",cut=(v,n)=>String(v||"").replace(/\s+/g," ").slice(0,n);
  if(r.src==="cal")return `[${i+1}] ${day} calendar event: ${x.title}${at}${x.location?" @ "+x.location:""}${x.desc?" | event notes: "+cut(x.desc,450):""}`;
  if(r.src==="mail")return `[${i+1}] ${day} from email "${cut(x.subject,90)}": ${x.title}${at}${x.details?" | "+cut(x.details,250):""}`;
  if(r.src==="task")return `[${i+1}] ${day} to-do${x.overdue?" (overdue)":""}${x.n.task.who==="partner"?" for "+partnerName():""}: ${x.title}`;
  return `[${i+1}] ${day} remembrd ${noteSrc(x.n)}: ${x.title}${at}${x.location?" @ "+x.location:""}${x.ev&&x.ev.details?" | "+cut(x.ev.details,250):""}${x.n.summary||x.n.text?" | note: "+cut(x.n.summary||x.n.text,300):""}`;
}
async function briefMaybe(force){

    const r=await geminiJSON(`Today is ${nowContext()}.
You write the "Heads up" rundown a busy working mom sees when she opens her notes app. Below is everything on her calendar, email, notes and to-do list for today and tomorrow.
Write up to 6 short bullets of what she needs to REMEMBER: things to bring, wear, pack, buy, pay, sign, send or prep, kid-specific asks, early starts, and to-dos that matter. Pull these details out of event notes and emails. Skip items where there is nothing to remember beyond the event itself (her schedule is shown right below this).

For each bullet: "day" is when she has to act ("tomorrow" for anything to bring, wear, pack, sign or send tomorrow morning; otherwise "today"). "kid" is the kid's name when it's for one of her kids, else null.

${lines.join("\n")}`,[]);
    const items=(Array.isArray(r.items)?r.items:[]).slice(0,8).map(x=>({text:String(x.text||"").slice(0,160),day:x.day==="tomorrow"?"tomorrow":"today",kid:kidNames().find(k=>k.toLowerCase()===String(x.kid||"").toLowerCase())||null,refs:(Array.isArray(x.refs)?x.refs:[]).map(Number).filter(n=>n>=1&&n<=rows.length)})).filter(x=>x.text);

function rowSrc(r){

      `REMEMBRD ${noteSrc(n)} saved ${n.createdAt.slice(0,10)} [${n.category}]: ${n.title} | ${String(n.summary||n.text||"").replace(/\s+/g," ").slice(0,400)}${(n.events||[]).map(e=>` | date: ${e.date}${e.start?" "+e.start:""} ${e.title}${e.details?" ("+e.details+")":""}`).join("")}${n.task?` | to-do: ${n.task.title}, due ${n.task.due}${n.task.doneAt?", done":""}`:""}`,
      {k:noteSrc(n),extra:n.title,href:n.msgId?mailLink({msgId:n.msgId}):""}));
    const r=await geminiJSON(`Today is ${nowContext()}.
You are remembrd, a personal assistant for a busy working mom. Answer her question using ONLY the sources below (her email, calendar and saved notes).
Lead with the direct answer (yes/no or the thing itself), then the key detail: who, what, when. Name which kid or person when the source says. If sources disagree, say so. If nothing below answers it, say you couldn't find it and suggest where she might check. 1-3 short sentences, plain words.

/* ---------- duplicate events on her calendar ---------- */
const normT=t=>String(t||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
let dupArm="";
function dupPairs(){
  const ok=new Set(lsGet("dup_ok",[])),items=(W.cal.items||[]).filter(x=>x.id&&x.date>=todayStr()),out=[],seen=new Set();
  const byDay={};items.forEach(x=>(byDay[x.date]=byDay[x.date]||[]).push(x));
  for(const d of Object.keys(byDay).sort()){
    const l=byDay[d];
    for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++){
      const a=l[i],b=l[j];
      if(a.id===b.id)continue; // same event showing on two calendars, not a copy
      if(!!a.start!==!!b.start)continue;
      if(a.start&&Math.abs(evStart(a)-evStart(b))>15*6e4)continue;
      if(normT(a.title)!==normT(b.title)&&!titleMatch(a.title,b.title))continue;
      const key=[a.calId+"/"+a.id,b.calId+"/"+b.id].sort().join("|");
      if(seen.has(key)||ok.has(key))continue;seen.add(key);
      out.push({key,date:d,a,b});
    }
  }
  return out;
}
function dupHTML(){
  if(!gcOn()||!W.cal.at)return "";
  const P=dupPairs();if(!P.length)return "";
  const edit=canEditCal();
  const copy=(x,p)=>{const ek=x.calId+"/"+x.id;return `<div class="dcopy"><div class="info"><b>${esc(x.title)}</b><span>${esc(x.cal||"Calendar")}${x.location?" · "+esc(x.location):""}${x.rec?" · repeats":""}</span></div>
    ${x.edit?`<button class="btn ${dupArm===ek?"armed":"danger"}" data-act="dupdel" data-v="${esc(ek)}">${dupArm===ek?"Tap to delete":"Delete"}</button>`:`<span class="hint" style="margin:0;flex:none">Can't edit</span>`}</div>`};
  return `<section class="dups"><h2>Possible duplicates (${P.length})</h2>
    <p class="hint" style="margin-top:2px">Same name, same day, same time on your calendar. Pick the copy to delete. Deleted events go to Google Calendar's trash for 30 days.${P.some(p=>p.a.rec||p.b.rec)?" For repeating events, this deletes that one date only.":""}</p>
    ${edit?"":`<button class="btn primary" data-act="dupedit" style="margin-top:10px;width:100%">Let remembrd delete duplicates</button><p class="hint">Google will ask you to allow calendar editing. One time.</p>`}

async function dupDelete(ek){
  if(dupArm!==ek){dupArm=ek;render();setTimeout(()=>{if(dupArm===ek){dupArm="";render()}},5000);return}
  dupArm="";
  const x=(W.cal.items||[]).find(i=>i.calId+"/"+i.id===ek);if(!x)return;
  if(!canEditCal()){lsSet("gcal_edit",true);gcAuth(false);return}
  const tok=gcTok();if(!tok){gcAuth(false);return}
  try{
    const r=await fetch(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(x.calId)}/events/${encodeURIComponent(x.id)}?sendUpdates=none`,{method:"DELETE",headers:{Authorization:"Bearer "+tok}});
    if(r.status===401){lsSet("gcal_token",null);gcAuth(false);return}
    if(r.status===403){let m="";try{m=(await r.json()).error.message||""}catch(e){}
      if(/insufficient|scope/i.test(m)){lsSet("gcal_edit",true);lsSet("gcal_scope","");gcAuth(false);return}
      toast("Google won't let remembrd delete from that calendar. It may be shared or read-only.");return}
    if(!r.ok&&r.status!==404&&r.status!==410){toast("Couldn't delete that one. Try again.");return}
    W.cal.items=W.cal.items.filter(i=>!(i.calId===x.calId&&i.id===x.id));lsSet("week_cal",W.cal);
    toast(`Deleted from ${x.cal||"your calendar"}. It's in Google Calendar's trash for 30 days.`);render();
  }catch(e){toast("Couldn't reach Google. Check your connection.")}
}

render();
(async function boot(){
  try{S.db=await openIDB();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    const all=await tx("notes","readonly",st=>st.getAll());
    S.notes=(all||[]).sort((a,b)=>a.createdAt<b.createdAt?1:-1);
    // anything left mid-sort when the app closed gets retried
    for(const n of S.notes)if(n.status==="sorting"){n.status="unsorted";n.err=null}
    // AEC / Ag Ed is her rodeo committee, not work: fix anything filed under Work
    addCat("Rodeo");const AEC=/\b(AEC|Ag\.? ?Ed|Agriculture Education)\b/i;
    for(const n of S.notes){const par=n.parent&&S.notes.find(x=>x.id===n.parent);
      if(n.category==="Work"&&(AEC.test([n.title,n.text,n.summary,...(n.events||[]).map(e=>e.title+" "+e.details),n.task&&n.task.title].join(" "))||par&&par.category==="Rodeo"&&AEC.test(par.title+" "+par.text+" "+par.summary))){n.category="Rodeo";putNote(n)}}
    for(const n of S.notes){const par=n.parent&&S.notes.find(x=>x.id===n.parent);if(par&&par.category==="Rodeo"&&n.category==="Work"){n.category="Rodeo";putNote(n)}}
    let mchg=false;(W.mail.items||[]).forEach(m=>{if(m.category==="Work"&&AEC.test(m.title+" "+m.details+" "+m.subject+" "+m.from)){m.category="Rodeo";mchg=true}});if(mchg)lsSet("week_mail",W.mail);
  }catch(e){console.warn("no storage",e);toast("Notes can't be saved in this browser (private browsing?)")}
  S.ready=true;render();
  if(gcBack==="ok"){const pend=takePending();if(pend.length){gcCals().catch(()=>{}).then(()=>addItems(pend))}else if(!lsGet("gcal_last",0))toast("Google connected");gcCheck(true);if(aggView())weekLoad(false)}
  else if(gcBack&&gcBack!=="state"&&(()=>{try{return sessionStorage.getItem("gcal_mode")==="manual"}catch(e){return false}})())toast("Google didn't connect. Try Connect Google again in Settings.");
  if(gcBack&&gcBack!=="ok")takePending();
  for(const n of S.notes.filter(x=>x.status==="unsorted"&&(!x.err||x.retry)))sortNote(n.id);
  if(gcBack===null){if(gcTok()){gcCheck(false);if(aggView())weekLoad(false)}else gcMaybeRefresh()}
  briefMaybe();
})();
// quietly retry notes that failed because Gemini was busy/offline
let retryT=null,retryDelay=60000;
function retryPending(){if(!getKey()||navigator.onLine===false)return;const due=S.notes.filter(x=>x.status==="unsorted"&&x.retry);due.forEach(n=>sortNote(n.id));return due.length}
function scheduleRetry(){if(retryT)return;retryT=setTimeout(()=>{retryT=null;if(retryPending())retryDelay=Math.min(retryDelay*2,15*60000)},retryDelay)}
let hiddenAt=0;
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){hiddenAt=Date.now();return}
  // back after a while counts as opening the app: start on Today
  if(hiddenAt&&Date.now()-hiddenAt>30*6e4&&$("#sheet").hidden&&!S.sel){S.view="today";A.res=null;A.err="";render();scrollTo(0,0)}
  retryDelay=60000;retryPending();gcCheck(false);if(aggView()&&gcTok())weekLoad(false);else if(aggView()&&!gcTok())gcMaybeRefresh();
});
addEventListener("online",()=>{retryDelay=60000;retryPending()});
</script>
